<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<title>物理刷题 · 高中选择题</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="description" content="高中物理选择题刷题工具：高考真题与真题改编，按知识点分类，支持错题本、收藏、随机组卷与题库导入。">
<meta name="theme-color" content="#16336e">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="物理刷题">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.png" sizes="64x64">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <header class="topbar">
    <button id="backBtn" class="icon-btn" type="button" aria-label="返回" hidden>‹</button>
    <h1 id="viewTitle">物理刷题</h1>
    <div class="topbar-right">
      <span id="timer" class="timer" hidden>00:00</span>
      <button id="themeBtn" class="icon-btn" type="button" aria-label="切换主题">◐</button>
    </div>
  </header>

  <main id="main" class="main">
    <div id="view" class="view"></div>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="主导航">
    <button class="tab is-active" data-tab="home" type="button"><span class="tab-ico">▤</span><span>练习</span></button>
    <button class="tab" data-tab="wrong" type="button"><span class="tab-ico">✗</span><span>错题本</span><span class="badge" id="wrongBadge" hidden>0</span></button>
    <button class="tab" data-tab="fav" type="button"><span class="tab-ico">★</span><span>收藏</span><span class="badge" id="favBadge" hidden>0</span></button>
    <button class="tab" data-tab="stats" type="button"><span class="tab-ico">◔</span><span>我的</span></button>
  </nav>

</div>

<noscript><p style="padding:24px;font:16px/1.7 system-ui">本应用需要启用 JavaScript 才能运行。</p></noscript>

<script src="data/questions.js"></script>
<script src="app.js"></script>
</body>
</html>
